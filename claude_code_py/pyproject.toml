[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "claude-code-py"
version = "0.1.0"
description = "Independent Python rewrite skeleton for Claude Code."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
  { name = "thy" }
]
dependencies = [
  "httpx>=0.27.2,<1.0.0",
  "pydantic>=2.9.2,<3.0.0",
  "pydantic-settings>=2.6.1,<3.0.0",
  "prompt-toolkit>=3.0.47,<4.0.0",
  "rich>=13.9.2,<14.0.0",
  "textual>=0.79.1,<1.0.0",
  "typer>=0.12.5,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.6.9,<1.0.0",
  "pyright>=1.1.383,<2.0.0",
]

[project.scripts]
claude-code-py = "claude_code_py.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_py"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
